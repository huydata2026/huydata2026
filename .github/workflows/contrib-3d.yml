name: 3D contribution calendar
# generated into ./profile-3d-contrib/ and committed to main

on:
  schedule:
    - cron: "0 17 * * *"   # 00:00 Viet Nam time, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/contrib-3d.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D calendar SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "chore: refresh 3D contribution calendar"
          git pull --rebase origin main
          git push
