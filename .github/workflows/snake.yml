name: Contribution Snake

on:
  schedule:
    - cron: "15 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%2300B32D&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39
            dist/snake-dark.svg?color_snake=%2300FF41&color_dots=%230A0A0A,%23003B00,%23006D00,%2300A000,%2300FF41

      - name: Publish to snake branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
