name: Latest projects section

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_projects.py", ".github/workflows/latest-projects.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Rebuild projects table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/update_projects.py

      - name: Commit if changed
        run: |
          if [[ -n $(git status --porcelain README.md) ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh latest projects"
            git pull --rebase origin main
            git push
          else
            echo "No changes."
          fi
