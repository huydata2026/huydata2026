<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Huydata - Data Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#121B3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A524"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1E2A4A"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1080" cy="160" r="150" fill="#F5A524" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1180" cy="80" r="90" fill="#38BDF8" opacity="0.12" filter="url(#glow)"/>
  <!-- bar chart -->
  <g transform="translate(960,90)">
    <rect x="0"   y="120" width="34" height="60"  rx="6" fill="#1E2A4A"/>
    <rect x="48"  y="90"  width="34" height="90"  rx="6" fill="#1E2A4A"/>
    <rect x="96"  y="60"  width="34" height="120" rx="6" fill="#38BDF8"/>
    <rect x="144" y="30"  width="34" height="150" rx="6" fill="#F5A524"/>
    <rect x="192" y="0"   width="34" height="180" rx="6" fill="url(#accent)"/>
    <polyline points="17,100 65,70 113,42 161,18 209,-8" fill="none" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="80" y="118" font-size="22" letter-spacing="6" fill="#8B95A7" font-weight="600">HELLO, I'M</text>
    <text x="78" y="190" font-size="72" font-weight="800" fill="#E6EDF3">Huydata</text>
    <rect x="80" y="214" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="80" y="258" font-size="26" fill="#E6EDF3" font-weight="500">Data Manager · Game Analytics · Data Engineering</text>
  </g>
</svg>
