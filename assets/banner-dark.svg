<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="huydata terminal banner">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000"/>
      <rect y="2" width="4" height="2" fill="#030603"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="1.2"/></filter>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, monospace; }
      .g  { fill: #00FF41; }
      .dg { fill: #00B32D; }
      .w  { fill: #C9D1D9; }
      .m  { fill: #6E7681; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .l1 { animation: fade 0.3s ease-out 0.2s both; }
      .l2 { animation: fade 0.3s ease-out 0.9s both; }
      .l3 { animation: fade 0.3s ease-out 1.6s both; }
      .l4 { animation: fade 0.3s ease-out 2.3s both; }
      .l5 { animation: fade 0.3s ease-out 3.0s both; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="380" fill="#000000"/>
  <rect width="1280" height="380" fill="url(#glow)"/>

  <!-- terminal window -->
  <rect x="60" y="34" width="1160" height="312" rx="12" fill="#050505" stroke="#1F2F1F" stroke-width="1.5"/>
  <rect x="60" y="34" width="1160" height="312" rx="12" fill="url(#scan)" opacity="0.6"/>
  <!-- title bar -->
  <rect x="60" y="34" width="1160" height="40" rx="12" fill="#0A0A0A"/>
  <rect x="60" y="62" width="1160" height="12" fill="#0A0A0A"/>
  <line x1="60" y1="74" x2="1220" y2="74" stroke="#1F2F1F" stroke-width="1"/>
  <circle cx="86" cy="54" r="6.5" fill="#FF5F56"/>
  <circle cx="108" cy="54" r="6.5" fill="#FFBD2E"/>
  <circle cx="130" cy="54" r="6.5" fill="#27C93F"/>
  <text x="640" y="59" text-anchor="middle" class="mono m" font-size="14">huydata@data:~ — zsh — 120×32</text>

  <!-- prompt lines -->
  <g class="mono" font-size="20">
    <g class="l1">
      <text x="96" y="118"><tspan class="dg">huydata@data</tspan><tspan class="m">:</tspan><tspan class="g">~</tspan><tspan class="m">$ </tspan><tspan class="w">whoami</tspan></text>
    </g>
    <g class="l2">
      <text x="96" y="162" class="g" font-size="44" font-weight="700" filter="url(#blur)" opacity="0.5">Huydata</text>
      <text x="96" y="162" class="g" font-size="44" font-weight="700">Huydata</text>
      <text x="300" y="162" class="w" font-size="22">// Data Manager · in data since 2019</text>
    </g>
    <g class="l3">
      <text x="96" y="214"><tspan class="dg">huydata@data</tspan><tspan class="m">:</tspan><tspan class="g">~</tspan><tspan class="m">$ </tspan><tspan class="w">cat stack.txt</tspan></text>
    </g>
    <g class="l4">
      <text x="96" y="250" class="w">[ <tspan class="g">ClickHouse</tspan> ] [ <tspan class="g">BigQuery</tspan> ] [ <tspan class="g">Airflow</tspan> ] [ <tspan class="g">dbt</tspan> ] [ <tspan class="g">Python</tspan> ] [ <tspan class="g">SQL</tspan> ]</text>
    </g>
    <g class="l5">
      <text x="96" y="300"><tspan class="dg">huydata@data</tspan><tspan class="m">:</tspan><tspan class="g">~</tspan><tspan class="m">$ </tspan><tspan class="w">./turn_events_into_decisions.sh --game-analytics</tspan></text>
      <rect x="96" y="314" width="12" height="22" class="g cursor"/>
    </g>
  </g>

  <!-- right-side mini chart -->
  <g transform="translate(1000,100)" opacity="0.85">
    <polyline points="0,120 30,100 60,108 90,70 120,78 150,40 180,30" fill="none" stroke="#00FF41" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="0,120 30,100 60,108 90,70 120,78 150,40 180,30 180,130 0,130" fill="#00FF41" opacity="0.08"/>
    <g fill="#00FF41"><circle cx="90" cy="70" r="3.5"/><circle cx="150" cy="40" r="3.5"/><circle cx="180" cy="30" r="3.5"/></g>
    <text x="0" y="150" class="mono m" font-size="12">retention_d7 ▲  roas_d30 ▲  cpi ▼</text>
  </g>
</svg>
